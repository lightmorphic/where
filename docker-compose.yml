services:
  where:
    image: ghcr.io/lightmorphic/where:latest
    container_name: where
    restart: unless-stopped
    ports:
      # Change the left-hand number to open the app on a different port.
      - "4150:8080"
    volumes:
      # The database, the photographs and the sign-in key all live here.
      - /opt/where/data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: where-ollama
    restart: unless-stopped
    volumes:
      - /opt/where/ollama:/root/.ollama
